<form (ngSubmit)="onSubmit()">
  <div class="calculator-card">
    <div class="form-grid">
      <div class="form-group">
        <label>Initial Investment</label>
        <input
          type="number"
          name="intialInvestment"
          [(ngModel)]="investment().initialInvestment"
        />
      </div>

      <div class="form-group">
        <label>Annual Investment</label>
        <input
          type="number"
          name="annualInvestment"
          [(ngModel)]="investment().annualInvestment"
        />
      </div>

      <div class="form-group">
        <label>Expected Return</label>
        <input
          type="number"
          name="expectedReturn"
          [(ngModel)]="investment().expectedReturn"
        />
      </div>

      <div class="form-group">
        <label>Duration</label>
        <input type="number" name="duration" [(ngModel)]="investment().duration" />
      </div>
    </div>

    <button type="submit" class="calculate-btn">CALCULATE</button>
  </div>
</form>
